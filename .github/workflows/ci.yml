name: Backend CI

on:
  push:
    branches:
      - main
      - tests/add-sanity-spec
  pull_request:
    branches:
      - main
      - tests/add-sanity-spec

# Cancel older runs of the same ref to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  pm2_deploy:
    name: Optional PM2 deploy (.env + pm2) — self-hosted only
    needs: backend-tests
    # Run only on non-PR events, on self-hosted runners, and when all secrets are set
    if: ${{ success() && github.event_name != 'pull_request' && contains(runner.labels, 'self-hosted') && secrets.MONGO_URI != '' && secrets.JWT_SECRET != '' && secrets.PORT != '' }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Write .env from repo secrets
        run: |
          printf "MONGO_URI=%s\nJWT_SECRET=%s\nPORT=%s\n" \
            "${{ secrets.MONGO_URI }}" \
            "${{ secrets.JWT_SECRET }}" \
            "${{ secrets.PORT }}" > .env

      - name: Install PM2 and (re)start app
        run: |
          npm i -g pm2
          pm2 delete smart-waste-backend || true
          pm2 start npm --name "smart-waste-backend" -- run start
          pm2 save
